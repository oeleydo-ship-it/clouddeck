[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/caddy/access-supervisor.log
stderr_logfile=/var/log/caddy/error-supervisor.log

[program:horizon]
directory=/var/www/html
command=php artisan horizon
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=3600

[program:reverb]
directory=/var/www/html
command=php artisan reverb:start --host=127.0.0.1 --port=8082
user=www-data
autostart=true
autorestart=true
priority=40

[program:scheduler]
directory=/var/www/html
command=bash -lc "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
user=www-data
autostart=true
autorestart=true
priority=50
